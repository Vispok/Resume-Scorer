<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>User Profile</title>

<link
    rel="stylesheet"
    href="profile.css">

</head>


<body>


<div class="container">


<h2>User Details</h2>


<div class="form-group">

<label>Full Name</label>

<input
    type="text"
    id="name"
    readonly>

</div>


<div class="form-group">

<label>Email</label>

<input
    type="email"
    id="email"
    readonly>

</div>


<div class="form-group">

<label>Phone Number</label>

<input
    type="text"
    id="phone"
    readonly>

</div>


<div class="form-group">

<label>Gender</label>

<input
    type="text"
    id="gender"
    readonly>

</div>


<div class="form-group">

<label>Date of Birth</label>

<input
    type="text"
    id="dob"
    readonly>

</div>



<form id="uploadForm">


<div class="form-group">

<label>

Upload Resume PDF
(Maximum 5 MB)

</label>


<input
    type="file"
    id="fileUpload"
    accept=".pdf"
    required>

</div>


<button type="submit">

Upload PDF

</button>


</form>


<p id="fileName"></p>

<p id="message"></p>


</div>


<script src="profile.js"></script>


</body>

</html>
